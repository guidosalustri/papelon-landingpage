baseURL = 'https://papelonstudio.me/'
locale = 'en-us'                     # renamed from languageCode in Hugo 0.158
defaultContentLanguage = 'en'
title = 'Papelon Studio'
theme = 're-terminal'
canonifyURLs = false
relativeURLs = false

[params]
  themeColor = 'paper'
  contentTypeName = 'posts'
  showLanguageSelector = true
  readingTime = true
  minuteReadingTime = "min"
  # Tells the theme how many menu links to show explicitly before collapsing them
  showMenuItems = 3

# Global logo fallback config
[params.logo]
  logoText = 'Papelon Studio'
  # Stale GitHub Pages project path until now. It was masked by the
  # per-language override below, which the multilingual work will restructure,
  # so correcting it here removes a trap for that change.
  logoHomeLink = '/'

[languages]
  [languages.en]
    label = 'English'                  # renamed from languageName in Hugo 0.158
    title = 'Papelon Studio'
    
    [languages.en.params]
      subtitle = 'Our Kickstarter Landing Page'
      favicon = '/favicon.png'
      keywords = ''
      copyright = ''
      readMore = 'Read more'
      readOtherPosts = 'Read other posts'
      
    # Language-specific logo override
    [languages.en.params.logo]
      logoText = 'Papelon Studio'
      logoHomeLink = '/'

    # --- THE SUBMENU BAR CONFIGURATION ---
    [languages.en.menu]
      # 1. This creates the primary parent dropdown button
      #[[languages.en.menu.main]]
      #  identifier = "submenus"
      #  name = "Sub menus"
      #  url = "#"
      #  weight = 10

      # 3. These sit normally on the menu bar next to the dropdown
      #[[languages.en.menu.main]]
      #  identifier = "about-sub"
      #  name = "About Us"
      #  url = "/posts/introducing-papelon/"
      #  parent = "submenus"
      #  weight = 20

      #[[languages.en.menu.main]]
      #  identifier = "games-sub"
      #  name = "Our Games"
      #  url = "/posts/our-games/"
      #  parent = "submenus"
      #  weight = 30
      
      [[languages.en.menu.main]]
        name = "About Us"
        url = "/posts/introducing-papelon/"
        weight = 20
      
      [[languages.en.menu.main]]
        name = "Our Games"
        url = "/posts/our-games/"
        weight = 30
      

  # ------------------------------------------------------------------
  # Svenska
  # Every user-facing string below is an ENGLISH PLACEHOLDER. Replace the
  # text inside the quotes; leave the keys alone.
  # ------------------------------------------------------------------
  [languages.sv]
    weight = 2
    label = 'Svenska'
    locale = 'sv-se'
    title = 'Papelon Studio'

    [languages.sv.params]
      subtitle = 'Our Kickstarter Landing Page'   # TRANSLATE
      favicon = '/favicon.png'
      keywords = ''
      copyright = ''
      readMore = 'Read more'                      # TRANSLATE
      readOtherPosts = 'Read other posts'         # TRANSLATE

    [languages.sv.params.logo]
      logoText = 'Papelon Studio'
      logoHomeLink = '/sv/'

    # pageRef rather than url, so Hugo resolves each link to this
    # language's copy of the page, e.g. /sv/posts/our-games/
    [[languages.sv.menu.main]]
      name = "About Us"                           # TRANSLATE
      pageRef = "/posts/introducing-papelon"
      weight = 20

    [[languages.sv.menu.main]]
      name = "Our Games"                          # TRANSLATE
      pageRef = "/posts/our-games"
      weight = 30

  # ------------------------------------------------------------------
  # Espanol
  # Every user-facing string below is an ENGLISH PLACEHOLDER. Replace the
  # text inside the quotes; leave the keys alone.
  # ------------------------------------------------------------------
  [languages.es]
    weight = 3
    label = 'Español'
    locale = 'es-es'
    title = 'Papelon Studio'

    [languages.es.params]
      subtitle = 'Our Kickstarter Landing Page'   # TRANSLATE
      favicon = '/favicon.png'
      keywords = ''
      copyright = ''
      readMore = 'Read more'                      # TRANSLATE
      readOtherPosts = 'Read other posts'         # TRANSLATE

    [languages.es.params.logo]
      logoText = 'Papelon Studio'
      logoHomeLink = '/es/'

    # pageRef rather than url, so Hugo resolves each link to this
    # language's copy of the page, e.g. /es/posts/our-games/
    [[languages.es.menu.main]]
      name = "About Us"                           # TRANSLATE
      pageRef = "/posts/introducing-papelon"
      weight = 20

    [[languages.es.menu.main]]
      name = "Our Games"                          # TRANSLATE
      pageRef = "/posts/our-games"
      weight = 30

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
